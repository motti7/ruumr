  direct:
    - with_user_id: demo-user-maya
      messages:
        - sender_id: demo-user-noam
          content: Hey Maya, looks like we're totally on the same page about a tidy apartment.
          days_ago: 1
          is_read: true
        - sender_id: demo-user-maya
          content: Totally. If we find one more good roommate, we can start searching for real.
          days_ago: 0
          is_read: false
  group:
    messages:
      - sender_id: demo-user-noam
        content: Once we complete the team, we'll pick a city and rank apartments together.
        days_ago: 1
      - sender_id: demo-user-maya
        content: Works for me. Tel Aviv or Givatayim are easiest for me.
        days_ago: 0

