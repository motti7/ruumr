<html lang="he" dir="rtl">
  <head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&family=Pacifico&family=Rubik:wght@700;900&display=swap" rel="stylesheet">
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/68c919adff6ac6fafb51bed6/8bae169ed_1770239914916.png" />
    <link rel="apple-touch-icon" href="https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/68c919adff6ac6fafb51bed6/8bae169ed_1770239914916.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E8420A" />
    <meta name="msapplication-TileColor" content="#E8420A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <title>Ruumr</title>
    <meta property="og:title" content="Ruumr - רומר" />
    <meta property="og:description" content="הטינדר של עולם השותפים - מוצאים שותפים לדירה בקלות" />
    <meta property="og:image" content="https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/68c919adff6ac6fafb51bed6/8bae169ed_1770239914916.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var url = new URL(window.location.href);
          var queryValue = url.searchParams.get('simulator_mode');
          var simulatorMode =
            queryValue === 'true' ||
            queryValue === '1' ||
            window.localStorage.getItem('ruumr_simulator_mode') === 'true';

          if (simulatorMode && !url.searchParams.has('analytics-enable')) {
            url.searchParams.set('analytics-enable', 'false');
            window.history.replaceState(window.history.state, '', url.pathname + url.search + url.hash);
          }
        } catch (_) {}
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
